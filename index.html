<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Калькулятор для сбора охоты</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 16px; }
    h1 { font-size: 1.5rem; }
    .form { display: grid; gap: 12px; max-width: 500px; margin-bottom: 24px; }
    label { display: grid; gap: 4px; font-weight: 600; }
    input, select, button { padding: 8px 10px; font-size: 1rem; }
    button { cursor: pointer; background: #2c7; color: #fff; border: none; border-radius: 6px; }
    button:hover { background: #1a5; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
    .error { color: #b00; background: #fee; padding: 12px; border-radius: 6px; border: 1px solid #fbb; }
    .note { color: #555; font-size: 0.95rem; margin: 6px 0; }
    .leftover { color: #b00; font-weight: bold; margin-top: 6px; }
    .result-block { margin-top: 16px; }
    .variant { margin-bottom: 24px; }
    .variant h3 { margin: 16px 0 8px; }
    .warning {
      background: #fff3cd;
      color: #856404;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ffeeba;
      margin: 10px 0;
      font-weight: bold;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <h1>Калькулятор для сбора охоты</h1>

  <div class="form">
    <label>Время сбора:
      <select id="time">
        <option value="normal">00:00, 10:00, 14:00</option>
        <option value="18">18:00</option>
        <option value="22">22:00</option>
      </select>
    </label>
    <label>Количество охотников:
      <input type="number" id="hunters" min="0" value="0">
    </label>
    <label>Количество носильщиков:
      <input type="number" id="porters" min="0" value="0">
    </label>
    <label>Количество ведущих (в т.ч. «желательно НВ»):
      <input type="number" id="leaders" min="0" value="0">
    </label>
    <button onclick="calculate()">Рассчитать</button>
  </div>

  <div id="result"></div>

  <script>
    const validPairs = [
      [0,0],
      [1,0], [1,1],
      [2,0], [2,1], [2,2],
      [3,0], [3,1], [3,2],
      [4,0], [4,1], [4,2],
      [5,0], [5,1], [5,2],
      [6,0], [6,1]
    ];

    function isPorterConstraintSatisfied(pArr, N, P) {
      if (P >= N) {
        return pArr.every(p => p >= 1);
      } else {
        if (pArr.some(p => p > 1)) return false;
        return pArr.filter(p => p === 1).length === P;
      }
    }

    function getCost(pairs) {
      const totals = pairs.map(p => p[0] + p[1]);
      const hunters = pairs.map(p => p[0]);
      const porters = pairs.map(p => p[1]);
      const totalDiff = Math.max(...totals) - Math.min(...totals);
      const hunterDiff = Math.max(...hunters) - Math.min(...hunters);
      const porterDiff = Math.max(...porters) - Math.min(...porters);
      const maxTotal = Math.max(...totals);
      return [totalDiff, hunterDiff, porterDiff, maxTotal];
    }

    function compareCost(a, b) {
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) return a[i] - b[i];
      }
      return 0;
    }

    function findBestPartition(N, H, P) {
      let best = null;
      let bestCost = null;
      const currentPairs = [];

      function rec(idx, sumH, sumP) {
        if (sumH > H || sumP > P) return;
        if (idx === N) {
          if (sumH === H && sumP === P) {
            const pArr = currentPairs.map(p => p[1]);
            if (!isPorterConstraintSatisfied(pArr, N, P)) return;
            const cost = getCost(currentPairs);
            if (bestCost === null || compareCost(cost, bestCost) < 0) {
              bestCost = cost;
              best = currentPairs.map(p => [...p]);
            }
          }
          return;
        }
        for (const p of validPairs) {
          if (sumH + p[0] > H || sumP + p[1] > P) continue;
          currentPairs.push(p);
          rec(idx + 1, sumH + p[0], sumP + p[1]);
          currentPairs.pop();
        }
      }
      rec(0, 0, 0);
      return best;
    }

    function evalPartition(N, H, P) {
      let best = null;
      let bestExtCount = Infinity;
      let bestCost = null;
      const currentPairs = [];

      function rec(idx, sumH, sumP) {
        if (sumH > H || sumP > P) return;
        if (idx === N) {
          if (sumH === H && sumP === P) {
            const pArr = currentPairs.map(p => p[1]);
            if (!isPorterConstraintSatisfied(pArr, N, P)) return;
            const extCount = currentPairs.filter(p => p[1] >= 2 || p[0] >= 6).length;
            const cost = getCost(currentPairs);
            if (
              extCount < bestExtCount ||
              (extCount === bestExtCount && (bestCost === null || compareCost(cost, bestCost) < 0))
            ) {
              bestExtCount = extCount;
              bestCost = cost;
              best = currentPairs.map(p => [...p]);
            }
          }
          return;
        }
        for (const p of validPairs) {
          if (sumH + p[0] > H || sumP + p[1] > P) continue;
          currentPairs.push(p);
          rec(idx + 1, sumH + p[0], sumP + p[1]);
          currentPairs.pop();
        }
      }
      rec(0, 0, 0);
      if (best === null) return null;
      return { pairs: best, extCount: bestExtCount };
    }

    function countExtended(pairs) {
      return pairs.filter(p => p[1] >= 2 || p[0] >= 6).length;
    }

    function findMaxSend(H, P, maxAvailable) {
      let bestTotal = -1;
      let allCombos = [];

      for (let n = 1; n <= maxAvailable; n++) {
        const currentPairs = [];
        function rec(idx, sumH, sumP) {
          if (sumH > H || sumP > P) return;
          if (idx === n) {
            if (sumH <= H && sumP <= P) {
              const pArr = currentPairs.map(p => p[1]);
              if (isPorterConstraintSatisfied(pArr, n, sumP)) {
                const total = sumH + sumP;
                if (total > bestTotal) {
                  bestTotal = total;
                  allCombos = [currentPairs.map(p => [...p])];
                } else if (total === bestTotal) {
                  allCombos.push(currentPairs.map(p => [...p]));
                }
              }
            }
            return;
          }
          for (const p of validPairs) {
            if (sumH + p[0] > H || sumP + p[1] > P) continue;
            currentPairs.push(p);
            rec(idx + 1, sumH + p[0], sumP + p[1]);
            currentPairs.pop();
          }
        }
        rec(0, 0, 0);
      }

      // Убираем пустые подотряды [0,0] и дедуплицируем
      const unique = [];
      const seen = new Set();
      for (const combo of allCombos) {
        const cleaned = combo.filter(p => !(p[0] === 0 && p[1] === 0));
        if (cleaned.length === 0) continue;
        const sorted = cleaned.map(p => [...p]).sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]) || a[0] - b[0] || a[1] - b[1]);
        const key = JSON.stringify(sorted);
        if (!seen.has(key)) {
          seen.add(key);
          unique.push(sorted);
        }
      }

      if (unique.length > 0) {
        const maxLen = Math.max(...unique.map(c => c.length));
        const filtered = unique.filter(c => c.length === maxLen);
        filtered.sort((a, b) => compareCost(getCost(a), getCost(b)));
        const minTotalDiff = getCost(filtered[0])[0];
        const balanced = filtered.filter(c => getCost(c)[0] === minTotalDiff);
        return { total: bestTotal, combos: balanced };
      }

      return { total: bestTotal, combos: unique };
    }

    function findMinSquadsNoExt(H, P, maxN) {
      const nonExtPairs = validPairs.filter(p => !(p[1] >= 2 || p[0] >= 6));

      for (let n = 1; n <= maxN; n++) {
        const currentPairs = [];
        let found = false;

        function rec(idx, sumH, sumP) {
          if (found) return;
          if (sumH > H || sumP > P) return;
          if (idx === n) {
            if (sumH === H && sumP === P) {
              const pArr = currentPairs.map(p => p[1]);
              if (isPorterConstraintSatisfied(pArr, n, P)) found = true;
            }
            return;
          }
          for (const p of nonExtPairs) {
            if (sumH + p[0] > H || sumP + p[1] > P) continue;
            currentPairs.push(p);
            rec(idx + 1, sumH + p[0], sumP + p[1]);
            currentPairs.pop();
            if (found) return;
          }
        }
        rec(0, 0, 0);
        if (found) return n;
      }
      return null;
    }

    function findMinSquadsForAll(H, P, maxN) {
      for (let n = 1; n <= maxN; n++) {
        if (findBestPartition(n, H, P)) return n;
      }
      return null;
    }

    function getDirections(time, N) {
      let directions = [];
      if (time === 'normal') {
        directions = ['Дремучая чаща', 'Серебристая река', 'Лисий лес'];
      } else if (time === '18') {
        directions = ['Сосновый овраг', 'Дремучая чаща', 'Серебристая река', 'Лисий лес'];
      } else if (time === '22') {
        if (N >= 2) {
          directions = ['Лисий лес', 'Сосновый овраг', 'Дремучая чаща', 'Серебристая река'];
        } else {
          directions = ['Лисий лес', 'Дремучая чаща', 'Серебристая река'];
        }
      }
      while (directions.length < N) directions.push('—');
      return directions;
    }

    function isExtendedUsed(pairs) {
      return pairs.some(p => p[1] >= 2 || p[0] >= 6);
    }

    function formatLeadersCount(n) {
      return n === 1 ? '1 ведущего' : `${n} ведущих`;
    }

    function calculate() {
      const time = document.getElementById('time').value;
      let H = parseInt(document.getElementById('hunters').value) || 0;
      let P = parseInt(document.getElementById('porters').value) || 0;
      let L = parseInt(document.getElementById('leaders').value) || 0;

      const isLate = (time === '18' || time === '22');
      const maxSquads = isLate ? 4 : 3;

      const errors = [];
      if (H < 0 || P < 0 || L < 0) errors.push('Числа не могут быть отрицательными.');
      if (H === 0 && P > 0) errors.push('Носильщики не могут идти без охотников.');
      if (H + P === 0) {
        document.getElementById('result').innerHTML = '<p>Нет участников для распределения.</p>';
        return;
      }
      if (errors.length) {
        document.getElementById('result').innerHTML = '<div class="error">' + errors.join('<br>') + '</div>';
        return;
      }

      let noteExtraLeaders = '';
      if (L > H + P) {
        noteExtraLeaders = `Указано ведущих больше, чем участников. Учтено только ${H + P}.`;
        L = H + P;
      }

      if (L === 0) {
        document.getElementById('result').innerHTML = '<div class="error">Нужен хотя бы один ведущий.</div>';
        return;
      }

      const N_req = Math.max(Math.ceil(H / 5), P);
      const maxAvailable = Math.min(L, maxSquads);
      const N_target = Math.min(N_req, maxSquads, L);

      const bestAll = findBestPartition(N_target, H, P);

      if (bestAll) {
        const N = N_target;
        const directions = getDirections(time, N);
        bestAll.sort((a, b) => (b[0] + b[1]) - (a[0] + a[1]) || b[0] - a[0]);
        const extended = isExtendedUsed(bestAll);
        const currentExtCount = countExtended(bestAll);

        let warningHtml = '';
        let phraseHtml = '';

        if (extended) {
          const N_noExt = findMinSquadsNoExt(H, P, maxSquads);
          if (N_noExt !== null && N_noExt > L) {
            const extra = N_noExt - L;
            warningHtml = '<div class="warning">Недостаточно ведущих для отправки без расширения</div>';
            phraseHtml = `<p class="note">Нужно найти ${formatLeadersCount(extra)}. Если нет — отправить расширенный подотряд.</p>`;
          } else {
            let bestN = null;
            let bestExt = currentExtCount;
            for (let n = maxAvailable + 1; n <= maxSquads; n++) {
              const r = evalPartition(n, H, P);
              if (r && r.extCount < bestExt) {
                bestExt = r.extCount;
                bestN = n;
              }
            }
            if (bestN !== null) {
              const add = bestN - L;
              warningHtml = '<div class="warning">Недостаточно ведущих для сокращения расширенных мест</div>';
              phraseHtml = `<p class="note">Нужно найти ${formatLeadersCount(add)}. Если нет — отправить расширенный подотряд.</p>`;
            }
          }
        }

        let html = '<div class="result-block">';
        html += '<h2>Результат</h2>';
        html += warningHtml;
        html += `<p><strong>Время:</strong> ${document.getElementById('time').options[document.getElementById('time').selectedIndex].text}</p>`;
        html += `<p><strong>Охотников:</strong> ${H}, <strong>Носильщиков:</strong> ${P}, <strong>Ведущих учтено:</strong> ${Math.min(L, N)}</p>`;
        if (noteExtraLeaders) html += `<p class="note">${noteExtraLeaders}</p>`;
        html += `<p><strong>Подотрядов:</strong> ${N}${extended ? ' (использованы расширенные места)' : ''}</p>`;
        if (extended) {
          html += `<p class="note">Расширенный подотряд: до 6 охотников и 2 носильщиков, но не более 7 котов суммарно (5+2 или 6+1).</p>`;
        }
        html += phraseHtml;
        html += '<table><thead><tr><th>№</th><th>Направление</th><th>Охотники</th><th>Носильщики</th></tr></thead><tbody>';
        for (let i = 0; i < N; i++) {
          const [h, p] = bestAll[i];
          html += `<tr><td>${i + 1}</td><td>${directions[i]}</td><td>${h}</td><td>${p}</td></tr>`;
        }
        html += '</tbody></table></div>';
        document.getElementById('result').innerHTML = html;
        return;
      }

      const minNForAll = findMinSquadsForAll(H, P, maxSquads);
      const canSendAllEventually = minNForAll !== null;

      let warningText;
      if (canSendAllEventually && L < minNForAll) {
        warningText = 'Недостаточно ведущих для отправки всех';
      } else if (H < P) {
        warningText = 'Невозможно отправить всех. Охотников должно быть не меньше носильщиков.';
      } else {
        warningText = 'Невозможно отправить всех';
      }

      const { total, combos } = findMaxSend(H, P, maxAvailable);

      if (total === -1 || combos.length === 0) {
        document.getElementById('result').innerHTML = '<div class="error">Невозможно сформировать ни один подотряд с заданными условиями.</div>';
        return;
      }

      let html = '<div class="result-block">';
      html += '<h2>Результат</h2>';
      html += `<div class="warning">${warningText}</div>`;
      html += `<p><strong>Время:</strong> ${document.getElementById('time').options[document.getElementById('time').selectedIndex].text}</p>`;
      html += `<p><strong>Всего охотников:</strong> ${H}, <strong>носильщиков:</strong> ${P}, <strong>ведущих:</strong> ${L}</p>`;
      if (noteExtraLeaders) html += `<p class="note">${noteExtraLeaders}</p>`;

      const anyExtended = combos.some(combo => isExtendedUsed(combo));
      if (anyExtended) {
        html += `<p class="note">Использованы расширенные места: до 6 охотников и 2 носильщиков, но не более 7 котов суммарно (5+2 или 6+1).</p>`;
      }

      let leadersNoteText = 'Показаны все оптимальные варианты распределения.';
      if (canSendAllEventually && L < minNForAll) {
        const add = minNForAll - L;
        if (anyExtended) {
          leadersNoteText += ` Нужно найти ${formatLeadersCount(add)}. Если нет — отправить первых вызвавшихся.`;
        } else {
          leadersNoteText += ' Нужно отправить первых вызвавшихся.';
        }
      } else {
        let bestN = null;
        let bestTotalMore = total;
        for (let n = maxAvailable + 1; n <= maxSquads; n++) {
          const r = findMaxSend(H, P, n);
          if (r.total > bestTotalMore) {
            bestTotalMore = r.total;
            bestN = n;
          }
        }
        if (bestN !== null) {
          const add = bestN - L;
          leadersNoteText += ` Нужно найти ${formatLeadersCount(add)} и отправить первых вызвавшихся.`;
        } else {
          leadersNoteText += ' Нужно отправить первых вызвавшихся.';
        }
      }
      html += `<p class="note">${leadersNoteText}</p>`;

      combos.forEach((combo, idx) => {
        const N = combo.length;
        const directions = getDirections(time, N);
        const extended = isExtendedUsed(combo);

        const sentH = combo.reduce((s, p) => s + p[0], 0);
        const sentP = combo.reduce((s, p) => s + p[1], 0);
        const leftoverH = H - sentH;
        const leftoverP = P - sentP;

        html += `<div class="variant">`;
        html += `<h3>Вариант ${idx + 1}${extended ? ' (расширенные места)' : ''}</h3>`;
        html += '<table><thead><tr><th>№</th><th>Направление</th><th>Охотники</th><th>Носильщики</th></tr></thead><tbody>';
        for (let i = 0; i < N; i++) {
          const [h, p] = combo[i];
          html += `<tr><td>${i + 1}</td><td>${directions[i]}</td><td>${h}</td><td>${p}</td></tr>`;
        }
        html += '</tbody></table>';
        if (leftoverH > 0 || leftoverP > 0) {
          html += `<p class="leftover">Не распределено: охотников — ${leftoverH}, носильщиков — ${leftoverP}</p>`;
        }
        html += '</div>';
      });

      html += '</div>';
      document.getElementById('result').innerHTML = html;
    }
  </script>
</body>
</html>
